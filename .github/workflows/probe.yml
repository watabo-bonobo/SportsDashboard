name: probe-j1
on:
  push:
    branches: [claude/sports-dashboard-tuyjrs]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: probe
        run: |
          set +e
          npm ci --silent
          cat > collector/p.mjs <<'JS'
          import * as jl from './sources/jleague.js';
          const UA = 'Mozilla/5.0 (compatible; SportsDashboardBot/1.0)';
          const fetchText = async (u) => { const r = await fetch(u, { headers: { 'User-Agent': UA, 'Accept-Language': 'ja' } }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); };
          console.log('clubs', jl.parseJ1Clubs(await fetchText('https://www.jleague.jp/j1/tv/search-list/?category=j1')).join(','));
          const t0 = Date.now();
          const ev = await jl.collect(new Date(), fetchText);
          console.log('total', ev.length, 'sec', (Date.now() - t0) / 1000);
          const by = {}; for (const e of ev) by[e.competition] = (by[e.competition] ?? 0) + 1; console.log(JSON.stringify(by));
          console.log('latest', ev.map((e) => e.start).sort().at(-1));
          for (const e of ev.filter((e) => /鹿島|長崎/.test(e.home + e.away))) console.log(e.id, e.start, e.competition, e.home, 'vs', e.away, JSON.stringify(e.result ?? ''), (e.broadcasts ?? []).map((b) => b.name).join('/'));
          JS
          node collector/p.mjs
          exit 0
