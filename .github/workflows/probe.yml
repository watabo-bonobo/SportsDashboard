name: probe
on: { push: { branches: [claude/sports-dashboard-tuyjrs] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: |
          set +e
          cat > probe.mjs <<'JS'
          import { standings, parse } from './collector/sources/npb.js';
          const UA='Mozilla/5.0 (compatible; SportsDashboard/1.0)';
          const f=async u=>{const r=await fetch(u,{headers:{'User-Agent':UA,'Accept-Language':'ja'},signal:AbortSignal.timeout(30000)});const t=await r.text();console.log('==',r.status,t.length,u);if(!r.ok)throw new Error('HTTP '+r.status);return t;};
          const st=await standings(new Date(), f);
          for (const t of st) { console.log(t.title); for (const r of t.rows) console.log(r.rank,r.team,r.played,r.win,r.loss,r.draw,(r.form||[]).map(x=>x.date.slice(5)+x.outcome[0]+x.score+x.opponent).join(' ')); }
          const u='https://npb.jp/games/2026/schedule_10_detail.html';
          const ev=parse(await f(u),u); console.log('oct games',ev.length, ev.slice(-6).map(e=>`${e.start} ${e.home}-${e.away} ${e.round} ${JSON.stringify(e.result)}`).join('\n'));
          JS
          node probe.mjs
          exit 0
