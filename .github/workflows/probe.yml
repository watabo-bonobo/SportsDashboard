name: probe
on: { push: { branches: [claude/sports-dashboard-tuyjrs] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: |
          set +e
          cat > probe.mjs <<'JS'
          import { standings, parse, formUrls } from './collector/sources/npb.js';
          const UA='Mozilla/5.0 (compatible; SportsDashboard/1.0)';
          const all=[];
          const f=async u=>{const r=await fetch(u,{headers:{'User-Agent':UA,'Accept-Language':'ja'},signal:AbortSignal.timeout(30000)});const t=await r.text();console.log('==',r.status,t.length,u);if(!r.ok)throw new Error('HTTP '+r.status);if(u.includes('schedule'))all.push(...parse(t,u));return t;};
          const t0=Date.now(); const st=await standings(new Date(), f); console.log('ms',Date.now()-t0);
          for (const t of st) { console.log(t.title); for (const r of t.rows) { const n=all.filter(e=>e.result&&(e.home===r.team||e.away===r.team)).length; console.log(r.rank,r.team,'played',r.played,'results',n,(r.form||[]).map(x=>x.date.slice(5)+x.outcome[0]+x.score+x.opponent).join(' ')); } }
          JS
          node probe.mjs
          exit 0
