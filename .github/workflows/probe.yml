name: probe
on: { push: { branches: [claude/sports-dashboard-tuyjrs] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: |
          set +e
          cat > probe.mjs <<'JS'
          import * as cheerio from 'cheerio';
          const r=await fetch('https://npb.jp/games/2026/schedule_10_detail.html',{headers:{'User-Agent':'Mozilla/5.0'}});const t=await r.text();
          const $=cheerio.load(t);
          const rows=$('tr[id^="date"]'); console.log('rows',rows.length);
          rows.each((i,tr)=>{ if(i<2||i>=rows.length-8) console.log(i,$(tr).attr('id'),$(tr).find('a').attr('href'),$(tr).text().replace(/\s+/g,' ').slice(0,120)); });
          const i=t.indexOf('id="date1010"'); console.log(t.slice(Math.max(0,i-3000),i+1500));
          JS
          node probe.mjs
          exit 0
