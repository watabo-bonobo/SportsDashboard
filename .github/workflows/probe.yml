name: probe-sources
on:
  push:
    branches: [claude/sports-dashboard-tuyjrs]
    paths: ['.github/workflows/probe.yml', 'collector/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node collector/collect.js "" public/data/events.json out.json
      - run: node -e "const d=require('./out.json'); for (const e of d.events.filter(e=>e.sport==='baseball')) console.log(JSON.stringify(e))"
