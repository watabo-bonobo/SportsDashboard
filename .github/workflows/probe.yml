name: probe-sources
on:
  push:
    branches: [claude/sports-dashboard-tuyjrs]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: fetch
        run: |
          mkdir out
          cat > probe.py <<'PY'
          import sys, re
          html = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          kw, n = sys.argv[2], int(sys.argv[3])
          print('next_data' , '__NEXT_DATA__' in html, 'next_f', html.count('self.__next_f'), 'ld+json', html.count('ld+json'))
          h = re.sub(r'<(script|style|svg|noscript)[^>]*>.*?</\1>', '', html, flags=re.S)
          h = re.sub(r'<(img|link|meta)[^>]*>', '', h)
          h = re.sub(r'\s(style|role|aria-[a-z]+|data-[a-z-]+|srcSet|src|loading|width|height|decoding|target|rel)="[^"]*"', '', h)
          h = re.sub(r'\s+', ' ', h)
          i = h.find(kw)
          print('kw', kw, h.count(kw), i)
          if i >= 0: print(h[max(0, i - n // 3): i + n])
          PY
          i=0
          while read -r kw n url; do
            i=$((i+1))
            code=$(curl -sL -A "Mozilla/5.0 (compatible; SportsDashboard)" -o out/$i.html -w "%{http_code}" --max-time 30 "$url")
            echo "=== $i $code $(wc -c < out/$i.html) $url"
            python3 probe.py out/$i.html "$kw" "$n"
          done <<'URLS'
          ニュージーランド 3500 https://www.jfa.jp/samuraiblue/schedule_result/2026.html
          ガンバ大阪 4000 https://www.jleague.jp/match/search/?category%5B%5D=j1&year=2026&month=10
          準々決勝 2500 https://www.jfa.jp/match/emperorscup_2026/schedule_result/
          チャイナスマッシュ 2500 https://www.tv-tokyo.co.jp/tabletennis/
          URLS
          echo "=== jleague json chunk"
          python3 - <<'PY'
          import re
          html = open('out/2.html', encoding='utf-8').read()
          for m in re.finditer(r'self\.__next_f\.push\(\[1,"(.*?)"\]\)', html, re.S):
              s = m.group(1)
              if 'ガンバ大阪' in s and ('DAZN' in s or 'dazn' in s):
                  i = s.find('ガンバ大阪'); print(s[max(0,i-1500):i+2500]); break
          PY
