name: probe
on:
  push:
    branches: [claude/sports-dashboard-tuyjrs]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          set +e
          node probe.mjs
          exit 0
