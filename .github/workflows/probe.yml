name: probe
on: { push: { branches: [claude/sports-dashboard-tuyjrs] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: |
          set +e
          cat > probe.mjs <<'JS'
          import { standings } from './collector/sources/jleague.js';
          import { parseResults, resultsUrl } from './collector/sources/jleague-data.js';
          import * as cheerio from 'cheerio';
          const UA='Mozilla/5.0 (compatible; SportsDashboard/1.0)';
          const f=async u=>{const r=await fetch(u,{headers:{'User-Agent':UA,'Accept-Language':'ja'},signal:AbortSignal.timeout(30000)});const t=await r.text();console.log('==',r.status,t.length,u);return t;};
          const html=await f(resultsUrl(new Date()));
          const $=cheerio.load(html);
          const trs=$('table tr'); console.log('rows',trs.length, 'tables', $('table').length);
          console.log(trs.eq(0).toString().slice(0,1500)); console.log(trs.eq(1).toString().slice(0,2500));
          const unplayed=trs.filter((_,t)=>!/\d+-\d+/.test($(t).text())).eq(1); console.log('UNPLAYED',unplayed.toString().slice(0,2500));
          console.log('pager', $('.pager, .pagination, [class*=page]').first().toString().slice(0,800));
          const ms=parseResults(html); const bySec={}; ms.forEach(m=>bySec[m.section]=(bySec[m.section]||0)+1); console.log('matches',ms.length,JSON.stringify(bySec));
          const st=await standings(new Date(), f);
          for (const r of st[0].rows) console.log(r.rank,r.team,r.played,(r.form||[]).map(x=>x.outcome[0]+x.score+x.opponent).join(' '),JSON.stringify(r.ranks));
          JS
          node probe.mjs
          exit 0
