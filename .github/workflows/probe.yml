name: probe-sources
on:
  push:
    branches: [claude/sports-dashboard-tuyjrs]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: fetch
        shell: bash
        run: |
          set +e
          mkdir out
          cat > clean.py <<'PY'
          import sys, re
          html = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          h = re.sub(r'<(script|style|svg|noscript|head)[^>]*>.*?</\1>', '', html, flags=re.S)
          h = re.sub(r'<!--.*?-->', '', h, flags=re.S)
          h = re.sub(r'<(img|link|meta|source|br)[^>]*>', '', h)
          h = re.sub(r'\s(style|role|aria-[a-z]+|data-[a-z-]+|srcset|src|loading|width|height|target|rel|onclick)="[^"]*"', '', h)
          h = re.sub(r'\s+', ' ', h)
          open(sys.argv[1] + '.c', 'w').write(h)
          PY
          get() { curl -sL -A "Mozilla/5.0 (compatible; SportsDashboard/1.0; +https://github.com/watabo-bonobo/SportsDashboard)" -o "out/$1" -w "=== $1 %{http_code} %{size_download} %{url_effective}\n" --max-time 30 "$2"; python3 clean.py "out/$1"; }
          show() { python3 -c "
          h=open('out/$1.c').read(); kw='$2'; i=h.find(kw); print('kw',kw,h.count(kw),i); print(h[max(0,i-$3):i+$4] if i>=0 else h[:$4])"; }
          links() { grep -o "href=\"[^\"]*\"" "out/$1" | sort -u | grep -i "$2" | head -60 | tr '\n' ' '; echo; }
          get j1s https://www.jleague.jp/j1/standings/
          python3 - <<'PY'
          import re
          h=open('out/j1s.c').read()
          print('tables', h.count('<table'), 'rows', h.count('o-table__row'), 'hidden S:', h.count('hidden id="S:'))
          print(re.findall(r'<h[1-4][^>]*>(.{0,120}?)</h[1-4]>', h)[:30])
          print(re.findall(r'o-table__club-link" href="([^"]+)"', h)[:60])
          PY
          get lhs https://leagueh.jp/schedule/
          show lhs '2026' 300 5000
          get lhm https://leagueh.jp/schedule/511M01/
          show lhm 'vs' 1500 5000
          get lhr https://leagueh.jp/rankings/
          show lhr '1' 0 200
          python3 -c "
          h=open('out/lhr.c').read(); i=h.find('<table'); print(h[i-1500:i+5000])"
          get jha https://www.handball.jp/
          curl -sIL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36" --max-time 40 https://www.handball.jp/ | head -20
          curl -sIL --max-time 40 http://handball.jp/ | head -10
          exit 0
