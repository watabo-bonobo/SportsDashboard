name: probe-sources
on:
  push:
    branches: [claude/sports-dashboard-tuyjrs]
    paths: ['.github/workflows/probe.yml', 'collector/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: collect
        run: |
          node collector/collect.js "" public/data/events.json /tmp/out.json
          node -e '
          const d = require("/tmp/out.json");
          for (const e of d.events) console.log([e.id, e.start, e.end ?? "", e.home ?? e.title, e.away ?? "", e.result ? e.result.home+"-"+e.result.away+" "+(e.result.note??"") : "", e.venue ?? "", (e.broadcasts??[]).map(b=>b.kind+":"+b.name).join(" ")].join(" | "))'
      - name: probe basketball / volleyball
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"
          for u in https://www.japanbasketball.jp/japan/schedule https://www.japanbasketball.jp/japan/men/schedule https://fibaworldcup2027-asianqualifiers.japanbasketball.jp/schedule/ https://www.jva.or.jp/national_team/2026/men_schedule/ https://www.jva.or.jp/national_team/2026/women_schedule/; do
            curl -sL -A "$UA" --max-time 20 -o /tmp/p.html -w "=== %{http_code} %{size_download} %{url_effective}\n" "$u" || echo "=== fail $u"
            python3 -c "
          import re; h=open('/tmp/p.html',encoding='utf-8',errors='replace').read()
          h=re.sub(r'<(script|style|svg|head|noscript)[^>]*>.*?</\1>','',h,flags=re.S); h=re.sub(r'<(img|link|meta|br|source)[^>]*>','',h); h=re.sub(r'\s(style|data-[a-z-]+|src|srcset|width|height|alt)=\"[^\"]*\"','',h); h=re.sub(r'\s+',' ',h)
          i=max(h.find('2026'),0); j=h.find('月', h.find('<main') if '<main' in h else 0)
          print(h[j-200:j+1800] if j>0 else h[:1500])"
          done
