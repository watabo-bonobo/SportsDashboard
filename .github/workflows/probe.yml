name: probe-acl
on:
  push:
    branches: [claude/sports-dashboard-tuyjrs]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: probe
        run: |
          set +e
          npm ci --silent
          cat > collector/p.mjs <<'JS'
          import * as jl from './sources/jleague.js';
          const UA = 'Mozilla/5.0 (compatible; SportsDashboardBot/1.0)';
          for (const u of jl.urls()) {
            const t = await (await fetch(u, { headers: { 'User-Agent': UA, 'Accept-Language': 'ja' } })).text();
            const ev = jl.parse(t, u);
            console.log('=====', u, ev.length);
            for (const e of ev.filter((e) => /^AFC/.test(e.competition))) console.log(e.start, e.competition, e.round, e.home, 'vs', e.away, JSON.stringify(e.result ?? ''), e.venue ?? '', (e.broadcasts ?? []).map((b) => b.name).join('/'));
          }
          JS
          node collector/p.mjs
          exit 0
