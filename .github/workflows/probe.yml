name: probe-sources
on:
  push:
    branches: [claude/sports-dashboard-tuyjrs]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: fetch
        run: |
          mkdir out
          i=0
          while read -r kw url; do
            i=$((i+1))
            code=$(curl -sL -A "Mozilla/5.0 (compatible; SportsDashboard)" -o out/$i.html -w "%{http_code}" --max-time 30 "$url")
            echo "=== $i $code $(wc -c < out/$i.html) $url"
            python3 - "out/$i.html" "$kw" <<'PY'
          import sys, re
          html = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          kw = sys.argv[2]
          idx = html.find(kw)
          print('title:', re.search(r'<title>(.*?)</title>', html, re.S).group(1).strip() if '<title>' in html else None)
          print('kw', kw, 'count', html.count(kw), 'first', idx)
          if idx >= 0:
              print(html[max(0, idx-2500):idx+2500])
          PY
          done <<'URLS'
          キリン https://www.jfa.jp/samuraiblue/schedule_result/2026.html
          DAZN https://www.jleague.jp/match/search/?category%5B%5D=j1&year=2026&month=10
          DAZN https://www.jleague.jp/match/search/?category%5B%5D=leaguecup&year=2026&month=10
          天皇杯 https://www.jfa.jp/match/emperorscup_2026/schedule_result/
          Window https://www.japanbasketball.jp/japan/schedule
          日本 https://www.jva.or.jp/national_team/2026/men_schedule/
          WTT https://www.tv-tokyo.co.jp/tabletennis/
          4633 https://www.thesportsdb.com/api/v1/json/123/eventsnextleague.php?id=4633
          URLS
