name: probe-sources
on:
  push:
    branches: [claude/sports-dashboard-tuyjrs]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: fetch
        shell: bash
        run: |
          set +e
          mkdir out
          cat > clean.py <<'PY'
          import sys, re
          html = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          h = re.sub(r'<(script|style|svg|noscript|head)[^>]*>.*?</\1>', '', html, flags=re.S)
          h = re.sub(r'<!--.*?-->', '', h, flags=re.S)
          h = re.sub(r'<(img|link|meta|source|br)[^>]*>', '', h)
          h = re.sub(r'\s(style|role|aria-[a-z]+|data-[a-z-]+|srcset|src|loading|width|height|target|rel|onclick)="[^"]*"', '', h)
          h = re.sub(r'\s+', ' ', h)
          open(sys.argv[1] + '.c', 'w').write(h)
          PY
          get() { curl -sL -A "Mozilla/5.0 (compatible; SportsDashboard/1.0; +https://github.com/watabo-bonobo/SportsDashboard)" -o "out/$1" -w "=== $1 %{http_code} %{size_download} %{url_effective}\n" --max-time 30 "$2"; python3 clean.py "out/$1"; }
          show() { python3 -c "
          h=open('out/$1.c').read(); kw='$2'; i=h.find(kw); print('kw',kw,h.count(kw),i); print(h[max(0,i-$3):i+$4] if i>=0 else h[:$4])"; }
          links() { grep -o "href=\"[^\"]*\"" "out/$1" | sort -u | grep -i "$2" | head -60 | tr '\n' ' '; echo; }
          get d17 "https://leagueh.jp/schedule/?s=2026&y=2026&m=10&d=17"
          python3 -c "
          import re; h=open('out/d17.c').read(); i=h.find('game-list'); print(re.findall(r'div_day[^\"]*\" id=\"div_day_\d+', h)); print(h[i:i+2500])"
          get nov "https://leagueh.jp/schedule/?s=2026&y=2026&m=11&n=next"
          python3 -c "
          import re; h=open('out/nov.c').read(); print(re.findall(r'id=\"div_day_\d+', h)); print(re.findall(r'schedule/(\w+)/', h)[:20])"
          get old "https://leagueh.jp/schedule/?s=2025&y=2026&m=3&d=1"
          python3 -c "
          import re; h=open('out/old.c').read(); i=h.find('game-list'); print(re.findall(r'id=\"div_day_\d+', h)); print(h[i:i+3000])"
          get lhr2 "https://leagueh.jp/rankings/?s=2025"
          python3 -c "
          h=open('out/lhr2.c').read(); i=h.find('</header>'); print(h[i:i+4000])"
          get jor http://handball.or.jp/
          links jor 'national\|japan\|schedule\|game\|match\|taikai\|日本代表'
          exit 0
